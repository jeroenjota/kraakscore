<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kraakscore invoer</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --ink: #12223a;
        --muted: #5f6b7a;
        --accent: #0d6efd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(
          circle at top right,
          #dce7ff,
          var(--bg) 50%
        );
        color: var(--ink);
        cursor: default;
      }
      input,
      textarea {
        cursor: text;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1px;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: var(--card);
        border-radius: 14px;
        border: 1px solid #dde3ee;
        box-shadow: 0 12px 24px rgba(17, 37, 68, 0.08);
        padding: 12px 4px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 1px 0;
        line-height: .5;
        text-align: center;
      }
      .meta {
        font-size: 1rem;
        color: var(--muted);
        width: fit-content;
        margin: 0;
        padding: 2px 10px;
        text-align: center;
        border-top:  1px solid #adadad;
        border-bottom: 1px solid #adadad;
        line-height: 1.2;
      }
      .meta-row {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        width: 100%;
        padding: 0 2px;
        margin: 6px 0 4px;
      }
      .meta-row .meta {
        grid-column: 2;
        margin: 0;
      }
      .meta-row-end {
        grid-column: 3;
        display: flex;
        justify-content: flex-end;
      }
      .meta-qr-btn {
        border: 1px solid #b7c0ce;
        border-radius: 4px;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 700;
        line-height: 1;
        padding: 4px 8px;
        cursor: pointer;
        align-self: stretch;
        width: fit-content;
        min-height: 12px;
        height: auto;
        display: flex;
        align-items: center;
      }
      .meta-qr-btn:hover {
        background: #eef3ff;
        color: #1f4fa8;
      }
      .qr-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .qr-overlay.is-open {
        display: flex;
      }
      .qr-modal {
        width: min(88vw, 260px);
        background: #fff;
        border-radius: 10px;
        border: 1px solid #d4dceb;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
        padding: 8px;
      }
      .qr-modal-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .qr-modal-title {
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 700;
      }
      .qr-close-btn {
        border: 1px solid #cbd4e4;
        background: #fff;
        color: #556173;
        border-radius: 6px;
        min-height: 0;
        width: auto;
        padding: 2px 6px;
        font-size: 0.75rem;
        line-height: 1;
        cursor: pointer;
      }
      .qr-image {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 6px;
      }
      .teams {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 2px;
      }
      .team-left,
      .team-right {
        font-weight: 700;
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: center;
        cursor: pointer;
      }
      .team-left.active,
      .team-right.active {
        text-decoration: underline;
      }
      .team-vs {
        display: none;
      }
      .team-panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 2px;
      }
      .team-panel {
        min-height: 32px;
      }
      .troef-box {
        border: 1px solid #dbe5f6;
        border-radius: 8px;
        background: #ffffff;
        padding: 2px 2px;
        display: none;
      }
      .troef-title {
        display: block;
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 4px;
        text-align: center;
      }
      .troef-options {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .troef-option {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 0.82rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .troef-option input {
        margin: 0;
      }
      .troef-suit {
        display: inline-block;
        min-width: 0.9em;
        text-align: center;
        font-size: 1.25rem;
        line-height: 1;
        font-weight: 700;
      }
      .troef-suit.black {
        color: #111111;
      }
      .troef-suit.red {
        color: #c62828;
      }
      .invoer-blok {
        border: 1px solid #e3eaf7;
        border-radius: 10px;
        padding: 1px;
        background: #fbfdff;
        margin-bottom: 2px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }
      .entry-grid {
        display: grid;
        grid-template-columns: minmax(84px, 0.9fr) 1fr 1fr;
        gap: 10px 8px;
        align-items: start;
        margin-bottom: 14px;
        padding: 1px;
      }
      .row-label {
        font-size: 0.80rem;
        color: var(--muted);
        font-weight: 600;
        padding-top: 2px;
        text-align: center;
      }
      .entry-cell {
        border: 1px solid #e3eaf7;
        border-radius: 10px;
        padding: 4px;
        background: #fbfdff;
      }
      .roem-counters {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
      }
      .roem-counter {
        border: 1px solid #dbe5f6;
        border-radius: 8px;
        padding: 1px;
        background: white;
      }
      .roem-counter-label {
        display: block;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .stepper {
        display: grid;
        grid-template-columns: 20px 1fr 20px;
        gap: 2px;
        align-items: center;
      }
      .stepper-btn {
        min-height: 26px;
        height: 26px;
        padding: 0;
        border-radius: 4px;
        border: 1px solid #c9d8f3;
        background: #eef4ff;
        color: #16345f;
        font-weight: 700;
        line-height: 1;
      }
      .stepper-count {
        text-align: center;
        font-weight: 700;
        font-size: 0.94rem;
      }
      .score-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .field-label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 3px;
        text-align: center;
      }
      .score-flags {
        border: 1px solid #dbe5f6;
        border-radius: 8px;
        background: #ffffff;
        padding: 5px 6px;
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        min-height: 26px;
        align-items: center;
      }
      .team-score-flags {
        display: none;
      }
      .score-flag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .score-flag input {
        margin: 0;
      }
      .compact-input {
        width: 100%;
        min-height: 26px;
        padding: 2px 3px;
        border: 1px solid #cdd8ea;
        border-radius: 5px;
        font-size: 0.95rem;
      }
      #pointsL,
      #pointsR,
      #scoreL,
      #scoreR {
        text-align: right;
      }
      .compact-input[readonly] {
        background: #f2f6fc;
        color: #2d466b;
        font-weight: 600;
      }
      .totals {
        margin: 0 0 12px;
        padding: 8px 10px;
        border: 1px solid #d8e3f5;
        border-radius: 10px;
        background: #f6faff;
        display: grid;
        grid-template-columns: 68px 116px 116px;
        column-gap: 8px;
        align-items: center;
      }
      .totals.final-mode {
        grid-template-columns: 1fr 1fr;
      }
      .totals-label {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--muted);
        text-align: left;
        letter-spacing: 0.01em;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-height: 1.5rem;
      }
      .totals.final-mode .totals-label {
        display: none;
      }
      .totals-col {
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 1.5rem;
      }
      .totals > :nth-child(1),
      .totals > :nth-child(2) {
        position: relative;
      }
      .totals > :nth-child(1)::after,
      .totals > :nth-child(2)::after {
        content: "";
        position: absolute;
        right: -4px;
        top: -4px;
        bottom: -4px;
        width: 2px;
        background: #dfe7f4;
      }
      .totals-value {
        font-size: 1.1rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        position: relative;
      }
      .totals-kruis-inline {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--muted);
        margin-left: 0;
        text-align: right;
        position: absolute;
        right: 0;
      }
      .score-roem-row {
        display: flex;
        flex-direction: row;
        gap: 10px;
      }
      .sub-label {
        display: block;
        margin: 0 0 6px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
      }
      .roem-inline {
        display: flex;
        flex-direction: column;
      }
      .score-inline {
        display: flex;
        flex-direction: column;
      }
      .score-inline input[type="text"].score-input {
        width: 6ch;
        min-height: 28px;
        padding: 1px 3px;
        font-size: 1rem;
        text-align: center;
      }
      .roem-inline input[type="text"].roem-input {
        width: 4ch;
        min-height: 28px;
        padding: 1px 3px;
        font-size: 1rem;
        text-align: center;
      }
      .roem-inline input[type="text"].kruis-input {
        width: 3ch;
        min-height: 28px;
        padding: 1px 3px;
        font-size: 1rem;
        text-align: center;
      }
      .partijlist {
        margin: 0 0 2px 0;
        border: 1px solid #e0e7f2;
        border-radius: 10px;
        background: #fcfdff;
        max-height: none;
        overflow-y: auto;
      }
      .partijlist.with-header {
        border-top: 0;
        border-radius: 0 0 10px 10px;
      }

      .partijlist-header {
        display: grid;
        grid-template-columns: 68px 116px 116px;
        /*                      68   172   288 +3*8 = 312 */
        column-gap: 8px;
        align-items: center;
        margin-top: 2px;
        padding: 4px 10px;
        font-size: 0.78rem;
        line-height: 1.2;
        color: var(--muted);
        font-weight: 700;
        border: 1px solid #e0e7f2;
        border-bottom: 1px solid #edf2fb;
        border-radius: 10px 10px 0 0;
      }

      .partijlist-header > span {
        display: flex;
        align-items: center;
        min-height: 1.1rem;
      }

      .partijlist-header.hidden {
        display: none;
      }
      .partijitem {
        display: grid;
        /*                     nr  tm/tr K    ScL  RmL  Xl    -  ScR   RmR  Xr */
        grid-template-columns: 16px 20px 16px 38px 38px 24px 38px 38px 16px;
        /*                      16   36  52   90   128  152  190  228  244 +8*8= 308 */
        column-gap: 8px;
        align-items: center;
        border-bottom: 1px solid #edf2fb;
        padding: 2px 10px;
        font-size: 0.9rem;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        cursor: pointer;
      }

      .partijitem.is-editing {
        background: #e8f2ff;
      }

      .partijitem > span {
        display: flex;
        align-items: center;
        min-height: 1rem;
      }

      .partijitem > span:nth-child(3),
      .partijitem > span:nth-child(6) {
        position: relative;
      }

      .partijitem > span:nth-child(3)::after,
      .partijitem > span:nth-child(6)::after {
        content: "";
        position: absolute;
        right: -4px;
        top: -4px;
        bottom: -4px;
        width: 2px;
        background: #dfe7f4;
      }

      .partijitem:last-child {
        border-bottom: 0;
      }
      .partijcol-right {
        text-align: right;
        justify-content: flex-end;
      }
      .partijcol-center {
        text-align: center;
        justify-content: center;
      }
      .partijcol-left {
        text-align: left;
        justify-content: flex-start;
      }
      .partij-troef-suit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.2em;
        text-align: center;
        font-weight: 700;
        font-size: 1.35rem;
        line-height: 1;
        vertical-align: baseline;
        transform: translateY(-0.08em);
      }
      .partij-troef-suit.black {
        color: #111111;
      }
      .partij-troef-suit.red {
        color: #c62828;
      }
      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 4px;
        margin: 0 0;
      }
      .btn-secondary {
        background: #eef3fb;
        color: #234;
      }
      .buttons button {
        padding: 8px 10px;
        min-height: 34px;
        font-size: 0.9rem;
        border-radius: 7px;
      }
      label {
        font-size: 0.9rem;
        font-weight: 500;
      }
      input[type="number"] {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        border: 1px solid #cdd8ea;
        border-radius: 8px;
        font-size: 1rem;
        min-height: 44px;
      }
      .row {
        margin-top: 10px;
      }
      .mode {
        margin: 10px 0;
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
      }

      .vet {
        font-weight: 700;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: white;
        padding: 14px 12px;
        font-weight: 600;
        font-size: 1rem;
        min-height: 24px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
      }
      #submitBtn.hidden {
        display: none;
      }
      #viewStandBtn.hidden {
        display: none;
      }
      .msg {
        margin-top: 10px;
        font-size: 0.9rem;
        text-align: center;
      }
      .ok {
        color: #167a2f;
      }
      .err {
        color: #b3261e;
      }

      @media (min-width: 480px) {
        .score-input {
          width: 8ch;
        }
        .roem-input {
          width: 6ch;
        }
        .kruis-input {
          width: 5ch;
        }
      }
      @media (max-width: 560px) {
        .score-flags[data-score-flags] {
          display: none;
        }
        .entry-grid {
          grid-template-columns: 1fr 1fr;
          gap: 4px;
        }
        .row-label {
          grid-column: 1 / -1;
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <form id="scoreForm" class="card" novalidate>
        <div class="flex flex-row gap-1">
        <h1 id="kopregel"></h1>
        <p id="lockicon"></p>
        </div>
        <div class="meta-row">
          <h2 id="meta" class="meta"></h2>
          <div class="meta-row-end">
            <button
              type="button"
              id="metaQrBtn"
              class="meta-qr-btn"
              title="Open QR-link voor dit scoreformulier"
              aria-label="Open QR-link voor dit scoreformulier"
            >
              Link
            </button>
          </div>
        </div>

        <div id="qrOverlay" class="qr-overlay" aria-hidden="true">
          <div class="qr-modal" role="dialog" aria-modal="true" aria-label="QR code scoreformulier">
            <div class="qr-modal-top">
              <span class="qr-modal-title">Link naar scoreformulier</span>
              <button type="button" id="qrCloseBtn" class="qr-close-btn" aria-label="Sluit QR venster">X</button>
            </div>
            <img id="qrImage" class="qr-image" alt="QR code voor scoreformulier" />
          </div>
        </div>

        <div class="teams">
          <span id="teamL" class="team-left"></span>
          <span class="team-vs">vs</span>
          <span id="teamR" class="team-right"></span>
        </div>

        <div class="team-panels">
          <div class="team-panel" data-team-panel="L"></div>
          <div class="team-panel" data-team-panel="R"></div>
        </div>

        <div id="troefBox" class="troef-box" aria-label="Troef">
          <div class="troef-options">
            <label class="troef-option"
              ><input
                class="troef-check"
                data-suit="clubs"
                type="checkbox"
                id="troefKlaver" /><span class="troef-suit black"
                >♣</span
              ></label
            >
            <label class="troef-option"
              ><input
                class="troef-check"
                data-suit="diamonds"
                type="checkbox"
                id="troefRuiten" /><span class="troef-suit red">♦</span></label
            >
            <label class="troef-option"
              ><input
                class="troef-check"
                data-suit="hearts"
                type="checkbox"
                id="troefHarten" /><span class="troef-suit red">♥</span></label
            >
            <label class="troef-option"
              ><input
                class="troef-check"
                data-suit="spades"
                type="checkbox"
                id="troefSchoppen" /><span class="troef-suit black"
                >♠</span
              ></label
            >
          </div>
        </div>

        <div
          id="scoreFlags"
          class="score-flags team-score-flags"
          data-score-flags
          aria-label="Score keuzes"
          title="K = Kraak, R = Re, S = Super">
          <label class="score-flag"
            ><input type="checkbox" id="scoreFlagK" />Kraak</label
          >
          <label class="score-flag"
            ><input type="checkbox" id="scoreFlagR" />Re</label
          >
          <label class="score-flag"
            ><input type="checkbox" id="scoreFlagS" />Super</label
          >
        </div>

        <div class="invoer-blok">
          <div class="entry-grid">
            <div class="row-label">Roem</div>
            <div class="entry-cell roem-counters" data-team="L">
              <div class="roem-counter">
                <span class="roem-counter-label">20</span>
                <div class="stepper">
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r20L"
                    data-step="-1">
                    -
                  </button>
                  <span id="r20L" class="stepper-count">0</span>
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r20L"
                    data-step="1">
                    +
                  </button>
                </div>
              </div>
              <div class="roem-counter">
                <span class="roem-counter-label">50</span>
                <div class="stepper">
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r50L"
                    data-step="-1">
                    -
                  </button>
                  <span id="r50L" class="stepper-count">0</span>
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r50L"
                    data-step="1">
                    +
                  </button>
                </div>
              </div>
              <div class="roem-counter">
                <span class="roem-counter-label">100</span>
                <div class="stepper">
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r100L"
                    data-step="-1">
                    -
                  </button>
                  <span id="r100L" class="stepper-count">0</span>
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r100L"
                    data-step="1">
                    +
                  </button>
                </div>
              </div>
              <div class="roem-counter">
                <span class="roem-counter-label">200</span>
                <div class="stepper">
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r200L"
                    data-step="-1">
                    -
                  </button>
                  <span id="r200L" class="stepper-count">0</span>
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r200L"
                    data-step="1">
                    +
                  </button>
                </div>
              </div>
            </div>
            <div class="entry-cell roem-counters" data-team="R">
              <div class="roem-counter">
                <span class="roem-counter-label">20</span>
                <div class="stepper">
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r20R"
                    data-step="-1">
                    -
                  </button>
                  <span id="r20R" class="stepper-count">0</span>
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r20R"
                    data-step="1">
                    +
                  </button>
                </div>
              </div>
              <div class="roem-counter">
                <span class="roem-counter-label">50</span>
                <div class="stepper">
                  <button
                    type="button"
                    class="stepper-btn"
                    data-target="r50R"
                    data-step="-1">
                    -
                  </button>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);

        const meta = document.getElementById("meta");
        const kopregel = document.getElementById("kopregel");
        const teamLEl = document.getElementById("teamL");
        const teamREl = document.getElementById("teamR");
        const modeText = document.getElementById("modeText");
