        const qrCloseBtnEl = document.getElementById("qrCloseBtn");
        const messageEl = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");
        const viewStandBtn = document.getElementById("viewStandBtn");
        const calcTotaalBtn = document.getElementById("calcTotaalBtn");
        const addPartijBtn = document.getElementById("addPartijBtn");
        const undoPartijBtn = document.getElementById("undoPartijBtn");
        const partijenListEl = document.getElementById("partijenList");
        const partijenListHeaderEl =
          document.getElementById("partijenListHeader");
        const totalLEl = document.getElementById("totalL");
        const totalREl = document.getElementById("totalR");
        const totalKruisWrapLEl = document.getElementById("totalKruisWrapL");
        const totalKruisWrapREl = document.getElementById("totalKruisWrapR");
        const totalKruisLEl = document.getElementById("totalKruisL");
        const totalKruisREl = document.getElementById("totalKruisR");
        const totalsLabelEl = document.getElementById("totalsLabel");
        const totalsBlockEl = document.getElementById("totalsBlock");
        const partijHeaderEl = document.getElementById("partijHeader");
        const partijRowLabelEl = document.getElementById("partijRowLabel");
        const teamPanelEls = {
          L: document.querySelector('[data-team-panel="L"]'),
          R: document.querySelector('[data-team-panel="R"]'),
        };
        const troefBoxEl = document.getElementById("troefBox");
        const scoreFlagsEl = document.getElementById("scoreFlags");
        const pointsLInput = document.getElementById("pointsL");
        const pointsRInput = document.getElementById("pointsR");
        const roemTotalLInput = document.getElementById("roemTotalL");
        const roemTotalRInput = document.getElementById("roemTotalR");
        const scoreLInput = document.getElementById("scoreL");
        const scoreRInput = document.getElementById("scoreR");
        const kruisCounts = { L: 0, R: 0 };
        const currentComputedKruis = { L: 0, R: 0 };
        const roemCountEls = {
          L: {
            20: document.getElementById("r20L"),
            50: document.getElementById("r50L"),
            100: document.getElementById("r100L"),
            200: document.getElementById("r200L"),
          },
          R: {
            20: document.getElementById("r20R"),
            50: document.getElementById("r50R"),
            100: document.getElementById("r100R"),
            200: document.getElementById("r200R"),
          },
        };

        const partijen = [];
        let sendInFlight = false;
        let sendAgain = false;
        let lastSubmittedWasFinal = false;
        let editingPartijIndex = null;
        const TOTAL_POINTS_PER_PARTIJ = 162;
        let scoreFlagState = null; // null | 'kraak' | 're' | 'super'
        let hasCalculatedTotal = false;

        const mode = params.get("mode") === "final" ? "final" : "immediate";

        // === Tabel-lock mekanisme: slechts één speler per tafel kan bewerken ===
        // Geneer/haal session-ID op voor deze browser
        function getOrCreateSessionId() {
          try {
            if (typeof sessionStorage === "undefined") return null;
            let id = sessionStorage.getItem("scoreEntrySessionId");
            if (!id) {
              id = "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
              sessionStorage.setItem("scoreEntrySessionId", id);
            }
            return id;
          } catch {
            return null;
          }
        }
        const sessionId = getOrCreateSessionId();
        let isViewOnlyMode = false;
        let lockCheckInterval = null;
        let lockRenewalInterval = null;
        let viewOnlyPollingInterval = null;
        let lastPolledPartijCount = 0;

        function getTabelLockKey() {
          const parts = [
            "scoreEntryTableLock",
            params.get("tid") || "-",
            params.get("date") || "-",
            params.get("mt") || "single",
            params.get("group") || "-",
            params.get("round") || "-",
            params.get("table") || "-",
            params.get("mi") || "-",
            params.get("fi") || "-",
          ];
          return parts.join("|");
        }
        const tabelLockKey = getTabelLockKey();
        const LOCK_TIMEOUT_MS = 600000; // 10 minuten

        function acquireTabelLock() {
          if (typeof localStorage === "undefined" || !sessionId) return false;
          try {
            const existingLock = localStorage.getItem(tabelLockKey);
            if (existingLock) {
              const [lockSessionId, lockTimestamp] = existingLock.split("|");
              const lockAge = Date.now() - Number(lockTimestamp);
              if (lockAge < LOCK_TIMEOUT_MS && lockSessionId !== sessionId) {
                // Iemand anders heeft het nog
                return false;
              }
            }
            // We kunnen de lock claimen
            localStorage.setItem(tabelLockKey, `${sessionId}|${Date.now()}`);
            return true;
          } catch {
            return false;
          }
        }

        function renewTabelLock() {
          if (typeof localStorage === "undefined" || !sessionId) return;
          try {
            const existingLock = localStorage.getItem(tabelLockKey);
            if (existingLock) {
              const [lockSessionId] = existingLock.split("|");
              if (lockSessionId === sessionId) {
                localStorage.setItem(tabelLockKey, `${sessionId}|${Date.now()}`);
              }
            }
          } catch {
            // Silent fail
          }
        }

        function releaseTabelLock() {
          if (typeof localStorage === "undefined" || !sessionId) return;
          try {
            const existingLock = localStorage.getItem(tabelLockKey);
            if (existingLock) {
              const [lockSessionId] = existingLock.split("|");
              if (lockSessionId === sessionId) {
                localStorage.removeItem(tabelLockKey);
              }
            }
          } catch {
            // Silent fail
          }
        }

        function checkAndUpdateViewOnlyMode() {
          if (typeof localStorage === "undefined" || !sessionId) return;
          try {
            const existingLock = localStorage.getItem(tabelLockKey);
            const shouldBeViewOnly = existingLock && !existingLock.startsWith(sessionId + "|");
            if (shouldBeViewOnly !== isViewOnlyMode) {
              isViewOnlyMode = shouldBeViewOnly;
              applyViewOnlyMode(isViewOnlyMode);
            }
          } catch {
            // Silent fail
          }
        }

        function startViewOnlyPolling() {
          if (typeof localStorage === "undefined") return;
          if (viewOnlyPollingInterval) return; // Voorkom dubbele intervals
          
          lastPolledPartijCount = partijen.length;
          viewOnlyPollingInterval = setInterval(() => {
            try {
              const rawState = localStorage.getItem(scoreEntryStateKey);
              if (!rawState) return;
              const parsedState = JSON.parse(rawState);
              const storedPartijen = Array.isArray(parsedState?.partijen) ? parsedState.partijen : [];
              
              // Controleer of het aantal partijen is veranderd
              if (storedPartijen.length !== lastPolledPartijCount) {
                lastPolledPartijCount = storedPartijen.length;
                partijen.splice(0, partijen.length, ...storedPartijen);
                renderPartijen();
              }
            } catch {
              // Silent fail
            }
          }, 1000); // Poll elke seconde
        }

        function stopViewOnlyPolling() {
          if (viewOnlyPollingInterval) {
            clearInterval(viewOnlyPollingInterval);
            viewOnlyPollingInterval = null;
          }
        }

        function applyViewOnlyMode(enabled) {
          // Disable/enable alle input controls
          [pointsLInput, pointsRInput].forEach((el) => {
            if (el) el.disabled = enabled;
          });
          document.querySelectorAll(".stepper-btn").forEach((btn) => {
            btn.disabled = enabled;
          });
          document.querySelectorAll(".troef-check").forEach((el) => {
            el.disabled = enabled;
          });
          document.querySelectorAll("#scoreFlagK, #scoreFlagR, #scoreFlagS").forEach((el) => {
            el.disabled = enabled;
          });
          [calcTotaalBtn, addPartijBtn, undoPartijBtn, submitBtn].forEach((btn) => {
            if (btn) btn.disabled = enabled;
          });

          // Toon/verberg lock icon
          const scoreForm = document.getElementById("scoreForm");
          const lockIcon = document.getElementById("lockicon");
          if (!lockIcon) return;
          if (!scoreForm) return;
          let viewOnlyMsg = scoreForm.querySelector(".view-only-notice");
          if (enabled) {
            if (submitBtn) {
              submitBtn.classList.add("hidden");
            }
            if (viewStandBtn) {
              viewStandBtn.classList.remove("hidden");
              viewStandBtn.disabled = false;
            }
            if (!viewOnlyMsg) {
              kopregel.textContent = "🔒 " + kopregel.textContent + " 🔒";
              // viewOnlyMsg = document.createElement("div");
              // viewOnlyMsg.className = "view-only-notice";
              // viewOnlyMsg.innerHTML = `
              //   <div style="background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; padding: 12px; margin-bottom: 12px; color: #856404; font-size: 0.9rem;">
              //     <strong>🔒</strong> 
              //   </div>
              // `;
              // scoreForm.insertBefore(viewOnlyMsg, scoreForm.firstChild);
            }
            // Start polling om bijwerkingen te zien
            startViewOnlyPolling();
          } else {
            if (submitBtn) {
              submitBtn.classList.remove("hidden");
            }
            if (viewStandBtn) {
              viewStandBtn.classList.add("hidden");
            }
            applyFinalSubmittedStateFromStorage();
            if (viewOnlyMsg) {
              viewOnlyMsg.remove();
            }
            // Stop polling als we niet meer in view-only modus zijn
            stopViewOnlyPolling();
          }
        }
        // === Einde lock mekanisme initialisatie ===

        const tournamentId = params.get("tid");
        const date = params.get("date");
        const matchType = params.get("mt") || "single";
        const group = params.get("group");
        const round = params.get("round");
        const table = params.get("table");
        const matchIndex = params.get("mi");
        const finalIndex = params.get("fi");
        const teamL = params.get("teamL") || "Team links";
        const teamR = params.get("teamR") || "Team rechts";
        const scoreTarget = Number(params.get("scoreTarget") || 2000);
        const winKruis = Number(params.get("winnerKruis") || 4);
        let initialBaseTotals = {
          left: Math.max(0, Number(params.get("startScoreL") || 0) || 0),
          right: Math.max(0, Number(params.get("startScoreR") || 0) || 0),
        };
        let initialKruisTotals = {
          left: Math.max(0, Number(params.get("startKruisL") || 0) || 0),
          right: Math.max(0, Number(params.get("startKruisR") || 0) || 0),
        };
        const initialLastTroefTeam = ["L", "R"].includes(
          params.get("lastTroefTeam"),
        )
          ? params.get("lastTroefTeam")
          : null;
        const datum = new Date(date).toLocaleDateString("nl-NL", {
          dateStyle: "medium",
        });
        teamLEl.textContent = teamL;
        teamREl.textContent = teamR;
        kopregel.textContent = `Scoreformulier ${datum || "?"}`;
        meta.textContent = `${group ? `groep ${String(group).toUpperCase()}: ` : ""}ronde ${round || "?"}, tafel ${table || "?"}`;

        if (mode === "final") {
          modeText.textContent =
            "Score na afloop van de partij naar hoofdscherm.";
        } else {
          modeText.textContent =
            "Score direct zichtbaar op hoofdscherm.";
        }

        function getFinalSubmittedStateKey() {
          const parts = [
            "scoreEntryFinalSubmitted",
            tournamentId || "-",
            date || "-",
            matchType || "-",
            group || "-",
            round || "-",
            table || "-",
            matchIndex || "-",
            finalIndex || "-",
            teamL || "-",
            teamR || "-",
          ];

          return parts.join("|");
        }

        const finalSubmittedStateKey = getFinalSubmittedStateKey();

        function getScoreEntryStateKey() {
          const parts = [
            "scoreEntryState",
            tournamentId || "-",
            date || "-",
            matchType || "-",
            group || "-",
            round || "-",
            table || "-",
            matchIndex || "-",
            finalIndex || "-",
            teamL || "-",
            teamR || "-",
          ];

          return parts.join("|");
        }

        const scoreEntryStateKey = getScoreEntryStateKey();

        function setFinalSubmittedState(isSubmitted) {
          if (mode !== "final" || typeof localStorage === "undefined") {
            return;
          }

          try {
            if (isSubmitted) {
              localStorage.setItem(finalSubmittedStateKey, "1");
            } else {
              localStorage.removeItem(finalSubmittedStateKey);
            }
          } catch {
            // localStorage is optioneel; UI blijft bruikbaar zonder persistentie.
          }
        }

        function applyFinalSubmittedStateFromStorage() {
          if (mode !== "final" || typeof localStorage === "undefined") {
            return;
          }

          try {
            const isSubmitted = localStorage.getItem(finalSubmittedStateKey) === "1";
            if (!isSubmitted) {
              return;
            }

            submitBtn.classList.add("hidden");
            viewStandBtn.classList.remove("hidden");
            setMessage("Eindtotaal is al verstuurd. Tik op 'Bekijk tussenstand'.", "ok");
          } catch {
            // localStorage is optioneel; geen actie nodig.
          }
        }

        function apiBaseUrl() {
          const isLocalHost =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1";

          if (isLocalHost) {
            return `${window.location.protocol}//${window.location.hostname}:54321/api/kraak`;
          }

          return `${window.location.origin}/laurierboom/api/api/kraak`;
        }

        function appBaseUrl() {
          const isLocalHost =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1";

          if (isLocalHost) {
            return `${window.location.origin}/`;
          }

          return `${window.location.origin}/kraakscore/`;
        }

        function buildStandingsUrl() {
          const url = new URL(appBaseUrl());
          if (tournamentId) {
            url.searchParams.set("tid", String(tournamentId));
          }
          url.searchParams.set("view", "stand");
          return url.toString();
        }

        function buildQrImageUrl() {
          const sourceUrl = window.location.href;
          const qrApiBase = "https://api.qrserver.com/v1/create-qr-code/";
          return `${qrApiBase}?size=360x360&data=${encodeURIComponent(sourceUrl)}`;
        }

        function closeMetaQrOverlay() {
          if (!qrOverlayEl) return;
          qrOverlayEl.classList.remove("is-open");
          qrOverlayEl.setAttribute("aria-hidden", "true");
        }

        function openMetaQrLink() {
          const qrUrl = buildQrImageUrl();
          if (!qrOverlayEl || !qrImageEl) {
            setMessage("QR venster kon niet geopend worden.", "err");
            return;
          }
          qrImageEl.src = qrUrl;
          qrOverlayEl.classList.add("is-open");
          qrOverlayEl.setAttribute("aria-hidden", "false");
        }

        // Filter inputs to accept only digits
        function setupNumericInputFilter(input) {
          input.addEventListener("input", (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, "");
          });
          input.addEventListener("keypress", (e) => {
            if (!/[0-9]/.test(e.key)) {
              e.preventDefault();
            }
          });
        }

        function setupSelectAllOnFocus(input) {
          if (isFirefoxBrowser()) {
            return;
          }
          input.addEventListener("focus", () => {
            input.select();
          });
        }

        function isFirefoxBrowser() {
          return /firefox/i.test(navigator.userAgent || "");
        }

        function focusElement(element) {
          if (!element || isFirefoxBrowser()) return;
          element.focus();
        }

        function setupFirefoxCursorGuard() {
          if (!isFirefoxBrowser()) return;

          const ensureCursorVisible = () => {
            if (getComputedStyle(document.body).cursor === "none") {
              document.body.style.cursor = "default";
            }
          };

          ["mousemove", "pointermove", "focusin", "input", "mouseenter"].forEach(
            (eventName) => {
              document.addEventListener(eventName, ensureCursorVisible, true);
            },
          );

          ensureCursorVisible();
        }

        function getRoemCount(team, value) {
          const el = roemCountEls[team][value];
          return Number(el?.textContent || 0);
        }

        function setKruisCount(team, nextValue) {
          kruisCounts[team] = Math.max(0, Math.min(32, Number(nextValue) || 0));
        }

        function setRoemCount(team, value, nextValue) {
          const el = roemCountEls[team][value];
          if (!el) return;
          const safeValue = Math.max(0, Math.min(99, nextValue));
          el.textContent = String(safeValue);
          updateRoemTotalDisplay();
          clearCurrentPartijTotal();
        }

        function updateRoemTotalDisplay() {
          const roemL = getRoemTotalForTeam("L");
          const roemR = getRoemTotalForTeam("R");
          roemTotalLInput.textContent = String(roemL);
          roemTotalRInput.textContent = String(roemR);
        }

        function getRoemTotalForTeam(team) {
          return (
            getRoemCount(team, 20) * 20 +
            getRoemCount(team, 50) * 50 +
            getRoemCount(team, 100) * 100 +
            getRoemCount(team, 200) * 200
          );
        }

        function updateRoem200Buttons() {
          if (!hasTroef()) return; // troef-gating gaat voor
          const total200 = getRoemCount("L", 200) + getRoemCount("R", 200);
          document
            .querySelectorAll(
              '.stepper-btn[data-target="r200L"], .stepper-btn[data-target="r200R"]',
            )
            .forEach((btn) => {
              const isPlus = btn.getAttribute("data-step") === "1";
              if (!isPlus) {
                btn.disabled = false;
                return;
              }
              const team = btn.getAttribute("data-target")?.endsWith("L")
                ? "L"
                : "R";
              const ownCount = getRoemCount(team, 200);
              btn.disabled = total200 >= 1 && ownCount === 0;
            });
        }

        function clampPoints(value) {
          if (!Number.isFinite(value)) return 0;
          return Math.max(
            0,
            Math.min(TOTAL_POINTS_PER_PARTIJ, Math.trunc(value)),
          );
        }

        function hasValidEnteredScore() {
          const pointsL = Number(pointsLInput.value || 0);
          const pointsR = Number(pointsRInput.value || 0);
          if (!Number.isFinite(pointsL) || !Number.isFinite(pointsR)) {
            return false;
          }
          return pointsL + pointsR === TOTAL_POINTS_PER_PARTIJ;
        }

        function hasTroef() {
          return !!(
            troefState.ownerTeam &&
            troefState.selectedSuit[troefState.ownerTeam]
          );
        }

        function getLastTroefTeam() {
          if (partijen.length === 0) return initialLastTroefTeam;
          return partijen[partijen.length - 1]?.troefTeam || null;
        }

        function hasReachedScoreTarget() {
          const { baseTotals } = getMatchTotals();
          return (
            baseTotals.left > scoreTarget || baseTotals.right > scoreTarget
          );
        }

        function updateActionButtons() {
          const matchFinished = hasReachedScoreTarget();
          const troefGekozen = hasTroef();
          const isEditingExistingPartij =
            Number.isInteger(editingPartijIndex) &&
            editingPartijIndex >= 0 &&
            editingPartijIndex < partijen.length;
          const canEditCurrentPartij =
            troefGekozen && (!matchFinished || isEditingExistingPartij);
          const canChooseTroef = !matchFinished || isEditingExistingPartij;

          pointsLInput.disabled = !canEditCurrentPartij;
          pointsRInput.disabled = !canEditCurrentPartij;
          document.querySelectorAll(".stepper-btn").forEach((btn) => {
            btn.disabled = !canEditCurrentPartij;
          });
          document.querySelectorAll(".troef-check").forEach((el) => {
            el.disabled = !canChooseTroef;
          });
          document
            .querySelectorAll("#scoreFlagK, #scoreFlagR, #scoreFlagS")
            .forEach((el) => {
              el.disabled = !canEditCurrentPartij;
            });
          calcTotaalBtn.disabled =
            !canEditCurrentPartij || !hasValidEnteredScore();
          addPartijBtn.disabled = !canEditCurrentPartij || !hasCalculatedTotal;
          undoPartijBtn.disabled = partijen.length === 0;
          submitBtn.disabled =
            partijen.length === 0 || !hasCalculatedTotal || !matchFinished;
        }

        function setFixedTotalPoints(changedTeam, options = {}) {
          if (changedTeam !== "L" && changedTeam !== "R") return;
          const normalizeSource = !!options.normalizeSource;
          const sourceInput = changedTeam === "L" ? pointsLInput : pointsRInput;
          const targetInput = changedTeam === "L" ? pointsRInput : pointsLInput;
          const sourceRawValue = sourceInput.value.trim();

          if (sourceRawValue === "") {
            sourceInput.value = "0";
            targetInput.value = "0";
            clearCurrentPartijTotal({ skipActionButtons: !normalizeSource });
            return;
          }

          const sourcePoints = clampPoints(Number(sourceInput.value || 0));
          const targetPoints = TOTAL_POINTS_PER_PARTIJ - sourcePoints;
          if (normalizeSource) {
            sourceInput.value = String(sourcePoints);
          }
          targetInput.value = String(targetPoints);
          clearCurrentPartijTotal({ skipActionButtons: !normalizeSource });
        }

        function getPartijMultiplierBySuit(troefSuit) {
          return troefSuit === "spades" ? 2 : 1;
        }

        function getCurrentPartijMultiplier() {
          if (!troefState.ownerTeam) return 1;
          const currentSuit = troefState.selectedSuit[troefState.ownerTeam];
          return getPartijMultiplierBySuit(currentSuit);
        }

        function getScoreFlagMultiplier(flag) {
          if (flag === "kraak") return 2;
          if (flag === "re") return 4;
          if (flag === "super") return 8;
          return 1;
        }

        function getSpelendePartij(troefTeam, scoreFlag) {
          if (troefTeam !== "L" && troefTeam !== "R") return troefTeam;
          if (scoreFlag === "kraak" || scoreFlag === "super") {
            return troefTeam === "L" ? "R" : "L";
          }
          return troefTeam;
        }

        function computePartijScores({
          pointsL,
          pointsR,
          roemL,
          roemR,
          troefTeam,
          troefSuit,
          scoreFlag,
        }) {
          const suitMultiplier = getPartijMultiplierBySuit(troefSuit);
          const flagMultiplier = getScoreFlagMultiplier(scoreFlag);
          const partijMultiplier = suitMultiplier * flagMultiplier;
          let baseScoreL = pointsL + roemL;
          let baseScoreR = pointsR + roemR;
          const totaalVoorNatL = baseScoreL;
          const totaalVoorNatR = baseScoreR;
          let extraKruisL = 0;
          let extraKruisR = 0;
          let pitBonusL = 0;
          let pitBonusR = 0;

          // Pit: één team telt alle punten. Winnaar krijgt +100 bonus (× multiplier)
          // en verliezer krijgt 1 kruis (× multiplier).
          if (pointsL === TOTAL_POINTS_PER_PARTIJ && pointsR === 0) {
            baseScoreL = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
            baseScoreR = 0;
            pitBonusL = 100;
            extraKruisR += partijMultiplier;
          } else if (pointsR === TOTAL_POINTS_PER_PARTIJ && pointsL === 0) {
            baseScoreR = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
            baseScoreL = 0;
            pitBonusR = 100;
            extraKruisL += partijMultiplier;
          }

          // Nat-regel:
          // - Kraak/Re/Super: Winner takes all. Verliezer gaat nat (0 punten), winnaar krijgt alles.
          // - Geen flag: Troefmaker gaat nat als hij verliest.
          // - Bij gelijke stand verliest de spelende partij (troefmaker/kraker).
          if (
            scoreFlag === "kraak" ||
            scoreFlag === "re" ||
            scoreFlag === "super"
          ) {
            const spelendePartij = getSpelendePartij(troefTeam, scoreFlag);
            // Winner takes all
            if (totaalVoorNatL < totaalVoorNatR) {
              baseScoreL = 0;
              baseScoreR = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
              extraKruisL += partijMultiplier;
            } else if (totaalVoorNatR < totaalVoorNatL) {
              baseScoreR = 0;
              baseScoreL = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
              extraKruisR += partijMultiplier;
            } else if (spelendePartij === "L") {
              baseScoreL = 0;
              baseScoreR = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
              extraKruisL += partijMultiplier;
            } else if (spelendePartij === "R") {
              baseScoreR = 0;
              baseScoreL = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
              extraKruisR += partijMultiplier;
            }
          } else if (troefTeam === "L" && totaalVoorNatL <= totaalVoorNatR) {
            // Geen flag: troefTeam L gaat nat als hij verliest
            baseScoreL = 0;
            baseScoreR = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
            extraKruisL += partijMultiplier;
          } else if (troefTeam === "R" && totaalVoorNatR <= totaalVoorNatL) {
            // Geen flag: troefTeam R gaat nat als hij verliest
            baseScoreR = 0;
            baseScoreL = TOTAL_POINTS_PER_PARTIJ + roemL + roemR;
            extraKruisR += partijMultiplier;
          }

          return {
            scoreL: (baseScoreL + pitBonusL) * partijMultiplier,
            scoreR: (baseScoreR + pitBonusR) * partijMultiplier,
            scoreMultiplier: partijMultiplier,
            extraKruisL,
            extraKruisR,
          };
        }

        function syncComputedScores() {
          const pointsL = Number(pointsLInput.value || 0);
          const pointsR = Number(pointsRInput.value || 0);
          const roemL = getRoemTotalForTeam("L");
          const roemR = getRoemTotalForTeam("R");
          const computed = computePartijScores({
            pointsL,
            pointsR,
            roemL,
            roemR,
            troefTeam: troefState.ownerTeam,
            troefSuit: troefState.ownerTeam
              ? troefState.selectedSuit[troefState.ownerTeam]
              : null,
            scoreFlag: scoreFlagState,
          });
          currentComputedKruis.L = computed.extraKruisL;
          currentComputedKruis.R = computed.extraKruisR;
          roemTotalLInput.textContent = String(roemL);
          roemTotalRInput.textContent = String(roemR);
          scoreLInput.value = String(computed.scoreL);
          scoreRInput.value = String(computed.scoreR);
          updateRoem200Buttons();
        }

        function clearCurrentPartijTotal(options = {}) {
          const skipActionButtons = !!options.skipActionButtons;
          hasCalculatedTotal = false;
          currentComputedKruis.L = 0;
          currentComputedKruis.R = 0;
          scoreLInput.value = "0";
          scoreRInput.value = "0";
          updateRoem200Buttons();
          if (!skipActionButtons) {
            updateActionButtons();
          }
        }

        function calculateCurrentPartijTotal(showMessage = false) {
          if (!hasValidEnteredScore()) {
            if (showMessage) {
              setMessage(
                `Getelde punten moeten samen precies ${TOTAL_POINTS_PER_PARTIJ} zijn.`,
                "err",
              );
            }
            updateActionButtons();
            return;
          }
          syncComputedScores();
          hasCalculatedTotal = true;
          updateActionButtons();
          if (showMessage) {
            setMessage("Totaal berekend.", "ok");
          }
        }

        function updatePartijLabels() {
          if (Number.isInteger(editingPartijIndex) && editingPartijIndex >= 0) {
            const text = `Partij ${editingPartijIndex + 1} bewerken`;
            if (partijHeaderEl) {
              partijHeaderEl.textContent = text;
            }
            return;
          }

          const nextIndex = partijen.length + 1;
          const text = `Partij ${nextIndex}`;
          if (partijHeaderEl) {
            partijHeaderEl.textContent = text;
          }
        }

        const troefState = {
          activeTeam: initialLastTroefTeam
            ? initialLastTroefTeam === "L"
              ? "R"
              : "L"
            : null,
          ownerTeam: null,
          selectedSuit: { L: null, R: null },
        };

        function saveScoreEntryState() {
          if (typeof localStorage === "undefined") {
            return;
          }

          try {
            if (partijen.length === 0) {
              localStorage.removeItem(scoreEntryStateKey);
              return;
            }

            localStorage.setItem(
              scoreEntryStateKey,
              JSON.stringify({ partijen }),
            );
          } catch {
            // localStorage is optioneel; UI blijft bruikbaar zonder persistentie.
          }
        }

        function applyScoreEntryStateFromStorage() {
          if (typeof localStorage === "undefined") {
            return;
          }

          try {
            const rawState = localStorage.getItem(scoreEntryStateKey);
            if (!rawState) {
              return;
            }

            const parsedState = JSON.parse(rawState);
            const storedPartijen = Array.isArray(parsedState?.partijen)
              ? parsedState.partijen
              : [];

            if (storedPartijen.length === 0) {
              return;
            }

            partijen.splice(0, partijen.length, ...storedPartijen);

            const lastTroefTeam = partijen[partijen.length - 1]?.troefTeam;
            troefState.activeTeam =
              lastTroefTeam === "L"
                ? "R"
                : lastTroefTeam === "R"
                  ? "L"
                  : troefState.activeTeam;
            troefState.ownerTeam = null;
            troefState.selectedSuit.L = null;
            troefState.selectedSuit.R = null;
          } catch {
            // Ongeldige state negeren; formulier blijft gewoon bruikbaar.
          }
        }

        function isMatchEntry(entry) {
          if (!entry) return false;
          const entryMt = String(entry.matchType || "single");
          const ourMt = String(matchType || "single");
          if (entryMt !== ourMt) return false;

          const sameTeams =
            String(entry.teamL || "").trim().toLowerCase() === String(teamL || "").trim().toLowerCase() &&
            String(entry.teamR || "").trim().toLowerCase() === String(teamR || "").trim().toLowerCase();

          if (ourMt === "final") {
            const entryFi = Number(entry.finalIndex);
            const ourFi = Number(finalIndex);
            if (Number.isFinite(entryFi) && Number.isFinite(ourFi)) {
              return entryFi === ourFi || sameTeams;
            }
            return sameTeams;
          }

          const sameRound =
            Number.isFinite(Number(entry.round)) &&
            Number.isFinite(Number(round)) &&
            Number(entry.round) === Number(round);
          const sameMi =
            Number.isFinite(Number(entry.matchIndex)) &&
            Number.isFinite(Number(matchIndex)) &&
            Number(entry.matchIndex) === Number(matchIndex);
          const sameTable =
            Number.isFinite(Number(entry.table)) &&
            Number.isFinite(Number(table)) &&
            Number(entry.table) === Number(table);

          if (ourMt === "group") {
            const sameGroup =
              String(entry.group || "").trim().toUpperCase() === String(group || "").trim().toUpperCase();
            return sameGroup && (sameMi || sameTable || sameTeams);
          }

          return (sameRound && sameMi) || (sameRound && sameTable) || sameTeams;
        }

        function applyRestoredEntry(entry) {
          const sanitizeStoredPartij = (partij) => {
            const safe = partij && typeof partij === "object" ? partij : {};
            const toInt = (value, min, max) => {
              const n = Number(value);
              if (!Number.isFinite(n)) return min;
              const t = Math.trunc(n);
              if (t < min) return min;
              if (t > max) return max;
              return t;
            };
            const asTeam = String(safe.troefTeam || "").trim().toUpperCase();
            const asSuit = String(safe.troefSuit || "").trim().toLowerCase();
            const asFlag = String(safe.scoreFlag || "").trim().toLowerCase();

            return {
              scoreL: toInt(safe.scoreL, 0, 2000),
              scoreR: toInt(safe.scoreR, 0, 2000),
              roemL: toInt(safe.roemL, 0, 2000),
              roemR: toInt(safe.roemR, 0, 2000),
              kruisL: toInt(safe.kruisL, 0, 32),
              kruisR: toInt(safe.kruisR, 0, 32),
              troefTeam: asTeam === "L" || asTeam === "R" ? asTeam : "",
              troefSuit: ["clubs", "diamonds", "hearts", "spades"].includes(asSuit)
                ? asSuit
                : null,
              scoreFlag: ["kraak", "re", "super"].includes(asFlag)
                ? asFlag
                : null,
            };
          };

          const storedPartijen = Array.isArray(entry?.parties)
            ? entry.parties.slice(0, 64).map(sanitizeStoredPartij)
            : [];
          if (storedPartijen.length === 0) return false;

          const sumScoreL = storedPartijen.reduce((s, p) => s + (Number(p?.scoreL) || 0), 0);
          const sumScoreR = storedPartijen.reduce((s, p) => s + (Number(p?.scoreR) || 0), 0);
          const sumKruisL = storedPartijen.reduce((s, p) => s + (Number(p?.kruisL) || 0), 0);
          const sumKruisR = storedPartijen.reduce((s, p) => s + (Number(p?.kruisR) || 0), 0);

          const baseL = Number.isFinite(Number(entry?.baseScoreL)) ? Number(entry.baseScoreL)
            : Number.isFinite(Number(entry?.scoreL)) ? Number(entry.scoreL) : null;
          const baseR = Number.isFinite(Number(entry?.baseScoreR)) ? Number(entry.baseScoreR)
            : Number.isFinite(Number(entry?.scoreR)) ? Number(entry.scoreR) : null;
          const kruisL = Number.isFinite(Number(entry?.kruisL)) ? Number(entry.kruisL) : null;
          const kruisR = Number.isFinite(Number(entry?.kruisR)) ? Number(entry.kruisR) : null;
          const loserBonusKruisL = Number.isFinite(Number(entry?.loserBonusKruisL))
            ? Number(entry.loserBonusKruisL)
            : 0;
          const loserBonusKruisR = Number.isFinite(Number(entry?.loserBonusKruisR))
            ? Number(entry.loserBonusKruisR)
            : 0;

          if (baseL !== null && baseR !== null) {
            initialBaseTotals = {
              left: Math.max(0, Math.trunc(baseL - sumScoreL)),
              right: Math.max(0, Math.trunc(baseR - sumScoreR)),
            };
          }
          if (kruisL !== null && kruisR !== null) {
            initialKruisTotals = {
              left: Math.max(0, Math.trunc(kruisL - sumKruisL - loserBonusKruisL)),
              right: Math.max(0, Math.trunc(kruisR - sumKruisR - loserBonusKruisR)),
            };
          }

          partijen.splice(0, partijen.length, ...storedPartijen);
          localStorage.setItem(scoreEntryStateKey, JSON.stringify({ partijen }));

          const lastTroefTeam = storedPartijen[storedPartijen.length - 1]?.troefTeam;
          troefState.activeTeam =
            lastTroefTeam === "L" ? "R" : lastTroefTeam === "R" ? "L" : troefState.activeTeam;
          troefState.ownerTeam = null;
          troefState.selectedSuit.L = null;
          troefState.selectedSuit.R = null;
          lastSubmittedWasFinal = !!entry?.isFinal;
          return true;
        }

        async function restoreExistingSubmission() {
          if (!tournamentId) return;
          try {
            const url = new URL(`${apiBaseUrl()}/score-forms/submissions`);
            url.searchParams.set("tournamentId", String(tournamentId));
            const response = await fetch(url.toString());
            if (!response.ok) return;
            const entries = await response.json();
            if (!Array.isArray(entries)) return;

            const relevant = entries
              .filter(isMatchEntry)
              .sort((a, b) => {
                const ta = new Date(a.submittedAt || a.timestamp || 0).getTime();
                const tb = new Date(b.submittedAt || b.timestamp || 0).getTime();
                return tb - ta;
              });

            const latest = relevant[0];
            if (!latest) return;

            const applied = applyRestoredEntry(latest);
            if (applied) {
              updatePartijLabels();
              updateTroefAndScorePanels();
              updateRoemTotalDisplay();
              renderPartijen();
              updateActionButtons();
              setMessage(`Bestaande invoer geladen (${partijen.length} partij${partijen.length === 1 ? "" : "en"}).`, "ok");
            }
          } catch (error) {
            // Stil falen; formulier werkt gewoon zonder herstelde state.
          }
        }

        function renderTroefSelection(team) {
          if (!troefBoxEl || troefState.activeTeam !== team) return;
          const selectedSuit = troefState.selectedSuit[team];
          document.querySelectorAll(".troef-check").forEach((checkbox) => {
            checkbox.checked =
              checkbox.getAttribute("data-suit") === selectedSuit;
          });
        }

        function updateTroefAndScorePanels() {
          ["L", "R"].forEach((team) => {
            const teamLabelEl = team === "L" ? teamLEl : teamREl;
            if (teamLabelEl) {
              teamLabelEl.classList.toggle(
                "active",
                troefState.activeTeam === team,
              );
            }
          });

          if (troefBoxEl) {
            if (troefState.activeTeam && teamPanelEls[troefState.activeTeam]) {
              teamPanelEls[troefState.activeTeam].prepend(troefBoxEl);
              troefBoxEl.style.display = "block";
              renderTroefSelection(troefState.activeTeam);
            } else {
              troefBoxEl.style.display = "none";
            }
          }

          if (scoreFlagsEl) {
            if (
              troefState.ownerTeam &&
              teamPanelEls[troefState.ownerTeam === "L" ? "R" : "L"]
            ) {
              const targetTeam = troefState.ownerTeam === "L" ? "R" : "L";
              teamPanelEls[targetTeam].appendChild(scoreFlagsEl);
              scoreFlagsEl.style.display = "flex";
            } else {
              scoreFlagsEl.style.display = "none";
            }
          }
        }

        function setTroefActiveTeam(team) {
          if (team !== "L" && team !== "R") return;
          if (partijen.length > 0) return;
          troefState.activeTeam = team;
          updateTroefAndScorePanels();
        }

        setupNumericInputFilter(pointsLInput);
        setupNumericInputFilter(pointsRInput);
        setupSelectAllOnFocus(pointsLInput);
        setupSelectAllOnFocus(pointsRInput);
        teamLEl.addEventListener("click", () => setTroefActiveTeam("L"));
        teamREl.addEventListener("click", () => setTroefActiveTeam("R"));
        document.querySelectorAll(".troef-check").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            if (!troefState.activeTeam) return;
            const team = troefState.activeTeam;
            const suit = checkbox.getAttribute("data-suit");
            if (!suit) return;

            if (checkbox.checked) {
              document.querySelectorAll(".troef-check").forEach((other) => {
                if (other !== checkbox) {
                  other.checked = false;
                }
              });
              troefState.selectedSuit[team] = suit;
              troefState.ownerTeam = team;
            } else if (troefState.selectedSuit[team] === suit) {
              troefState.selectedSuit[team] = null;
              if (troefState.ownerTeam === team) {
                troefState.ownerTeam = null;
              }
            }
            updateTroefAndScorePanels();
            clearCurrentPartijTotal();
            updateActionButtons();
          });
        });
        document
          .querySelectorAll("#scoreFlagK, #scoreFlagR, #scoreFlagS")
          .forEach((checkbox) => {
            checkbox.addEventListener("change", () => {
              if (checkbox.checked) {
                const flagMap = {
                  scoreFlagK: "kraak",
                  scoreFlagR: "re",
                  scoreFlagS: "super",
                };
                scoreFlagState = flagMap[checkbox.id] || null;
                document
                  .querySelectorAll("#scoreFlagK, #scoreFlagR, #scoreFlagS")
                  .forEach((other) => {
                    if (other !== checkbox) other.checked = false;
                  });
              } else {
                scoreFlagState = null;
              }
              clearCurrentPartijTotal();
            });
          });
        pointsLInput.addEventListener("input", () => setFixedTotalPoints("L"));
        pointsRInput.addEventListener("input", () => setFixedTotalPoints("R"));
        pointsLInput.addEventListener("blur", () =>
          setFixedTotalPoints("L", { normalizeSource: true }),
        );
        pointsRInput.addEventListener("blur", () =>
          setFixedTotalPoints("R", { normalizeSource: true }),
        );
        document.querySelectorAll(".stepper-btn").forEach((button) => {
          button.addEventListener("click", () => {
            const targetId = button.getAttribute("data-target");
            const step = Number(button.getAttribute("data-step") || 0);
            const target = document.getElementById(targetId);
            if (!target || !Number.isFinite(step)) return;

            const roemMatch = /^r(20|50|100|200)(L|R)$/.exec(targetId);
            if (!roemMatch) return;
            const roemValue = Number(roemMatch[1]);
            const roemTeam = roemMatch[2];

            if (targetId === "r200L" || targetId === "r200R") {
              const otherTargetId = targetId.endsWith("L") ? "r200R" : "r200L";
              const currentValue = Number(target.textContent || 0);
              const otherValue = Number(
                document.getElementById(otherTargetId)?.textContent || 0,
              );
              const nextValue = currentValue + step;
              if (
                step > 0 &&
                (currentValue >= 1 || otherValue >= 1 || nextValue > 1)
              ) {
                setMessage(
                  "200 roem mag per partij maximaal 1x voorkomen bij een van beide teams.",
                  "err",
                );
                return;
              }
            }

            const currentValue = Number(target.textContent || 0);
            setRoemCount(roemTeam, roemValue, currentValue + step);
          });
        });

        function setMessage(text, type) {
          messageEl.textContent = text;
          messageEl.className = `msg ${type}`;
        }

        function getTotals() {
          return partijen.reduce(
            (acc, partij) => {
              acc.left += Number(partij?.scoreL) || 0;
              acc.right += Number(partij?.scoreR) || 0;
              return acc;
            },
            {
              left: initialBaseTotals.left,
              right: initialBaseTotals.right,
            },
          );
        }

        function getRoemTotals() {
          return partijen.reduce(
            (acc, partij) => {
              acc.left += Number(partij?.roemL) || 0;
              acc.right += Number(partij?.roemR) || 0;
              return acc;
            },
            { left: 0, right: 0 },
          );
        }

        function getKruisTotals() {
          return partijen.reduce(
            (acc, partij) => {
              acc.left += Number(partij?.kruisL) || 0;
              acc.right += Number(partij?.kruisR) || 0;
              return acc;
            },
            {
              left: initialKruisTotals.left,
              right: initialKruisTotals.right,
            },
          );
        }

        function getMatchTotals(isFinal = false) {
          const baseTotals = getTotals();

          const kruisTotals = getKruisTotals();

          const currentTotals = {
            left: baseTotals.left,
            right: baseTotals.right,
          };

          let winnerTeam = null;
          const loserBonusKruis = { left: 0, right: 0 };

          if (isFinal && partijen.length > 0) {
            const bothAboveTarget =
              currentTotals.left > scoreTarget &&
              currentTotals.right > scoreTarget;

            if (bothAboveTarget) {
              winnerTeam = getLastTroefTeam();
            } else if (currentTotals.left > currentTotals.right) {
              winnerTeam = "L";
            } else if (currentTotals.right > currentTotals.left) {
              winnerTeam = "R";
            } else {
              winnerTeam = getLastTroefTeam();
            }

            if (winnerTeam === "L") {
              loserBonusKruis.right = winKruis;
            } else if (winnerTeam === "R") {
              loserBonusKruis.left = winKruis;
            }
          }

          const finalKruisTotals = {
            left: kruisTotals.left + loserBonusKruis.left,
            right: kruisTotals.right + loserBonusKruis.right,
          };

          const finalTotals = {
            // Kruisen van een team tellen als 100 punten voor de tegenstander.
            left: baseTotals.left + finalKruisTotals.right * 100,
            right: baseTotals.right + finalKruisTotals.left * 100,
          };

          return {
            baseTotals,
            kruisTotals,
            currentTotals,
            winnerTeam,
            loserBonusKruis,
            finalKruisTotals,
            finalTotals,
          };
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function renderPartijen() {
          const troefDisplayBySuit = {
            clubs: { symbol: "♣", colorClass: "black" },
            diamonds: { symbol: "♦", colorClass: "red" },
            hearts: { symbol: "♥", colorClass: "red" },
            spades: { symbol: "♠", colorClass: "black" },
          };
          const matchFinished = hasReachedScoreTarget();
          const includeWinnerBonus = lastSubmittedWasFinal;
          const { currentTotals, baseTotals, kruisTotals, loserBonusKruis } =
            getMatchTotals(includeWinnerBonus);
          const kruisTotalsSoFar = getKruisTotals();
          if (totalsLabelEl) {
            totalsLabelEl.style.display = matchFinished ? "none" : "flex";
          }
          if (totalsBlockEl) {
            totalsBlockEl.classList.toggle("final-mode", matchFinished);
          }

          if (matchFinished && includeWinnerBonus) {
            const leftNormalKruis = Number(kruisTotals.right || 0);
            const rightNormalKruis = Number(kruisTotals.left || 0);
            const leftWinKruis = Number(loserBonusKruis.right || 0);
            const rightWinKruis = Number(loserBonusKruis.left || 0);

            const leftKruisTerm =
              leftWinKruis > 0
                ? `(${leftNormalKruis}+${leftWinKruis})X`
                : `${leftNormalKruis}X`;
            const rightKruisTerm =
              rightWinKruis > 0
                ? `(${rightNormalKruis}+${rightWinKruis})X`
                : `${rightNormalKruis}X`;

            totalLEl.textContent = `${baseTotals.left} + ${leftKruisTerm}`;
            totalREl.textContent = `${baseTotals.right} + ${rightKruisTerm}`;
          } else {
            totalLEl.textContent = String(currentTotals.left);
            totalREl.textContent = String(currentTotals.right);
          }

          totalKruisLEl.textContent = String(kruisTotalsSoFar.left);
          totalKruisREl.textContent = String(kruisTotalsSoFar.right);
          if (matchFinished) {
            totalKruisWrapLEl.style.display = "none";
            totalKruisWrapREl.style.display = "none";
          } else {
            totalKruisWrapLEl.style.display =
              kruisTotalsSoFar.left > 0 ? "inline" : "none";
            totalKruisWrapREl.style.display =
              kruisTotalsSoFar.right > 0 ? "inline" : "none";
          }

          if (partijen.length === 0) {
            if (partijenListHeaderEl) {
              partijenListHeaderEl.classList.add("hidden");
            }
            partijenListEl.classList.remove("with-header");
            partijenListEl.style.maxHeight = "none";
            partijenListEl.scrollTop = 0;
            // partijenListEl.classList.add("hidden");
            return;
          }

          if (partijenListHeaderEl) {
            partijenListHeaderEl.classList.remove("hidden");
          }
          partijenListEl.classList.add("with-header");

          partijenListEl.innerHTML = partijen
            .map((partij, index) => {
              const spelendTeam =
                getSpelendePartij(partij.troefTeam, partij.scoreFlag) ||
                partij.troefTeam ||
                "";
              const troefDisplay = troefDisplayBySuit[partij.troefSuit] || {
                symbol: "?",
                colorClass: "black",
              };
              const troefText = `<span class="partij-troef-suit ${troefDisplay.colorClass}">${escapeHtml(troefDisplay.symbol)}</span>`;
              let scoreFlagText = " ";
              if (partij.scoreFlag) {
                const flagExclamations = { kraak: "!", re: "!!", super: "!!!" };
                scoreFlagText = flagExclamations[partij.scoreFlag] || " ";
              }
              const roemL = Number(partij.roemL) || 0;
              const roemR = Number(partij.roemR) || 0;
              const kruisL = Number(partij.kruisL) || 0;
              const kruisR = Number(partij.kruisR) || 0;
              const scoreL = Number(partij.scoreL) || 0;
              const scoreR = Number(partij.scoreR) || 0;
              const roemLText = roemL > 0 ? `(${roemL}r)` : "";
              const roemRText = roemR > 0 ? `(${roemR}r)` : "";
              const kruisLText = kruisL > 0 ? `${kruisL}X` : "";
              const kruisRText = kruisR > 0 ? `${kruisR}X` : "";
              const spel = `${escapeHtml(spelendTeam)}${troefText}`.trim();
              const isEditing = editingPartijIndex === index ? " is-editing" : "";
              return `<div class="partijitem${isEditing}" data-partij-index="${index}"><span>${
                index + 1
              }:</span><span class="partijcol-center">${spel}</span><span class="partijcol-center">${scoreFlagText}</span><span class="partijcol-right vet">${
                scoreL
              }</span><span class="partijcol-right">${roemLText}</span><span class="partijcol-center">${kruisLText}</span></span><span class="partijcol-right vet">${
                scoreR
              }</span><span class="partijcol-right">${roemRText}</span><span class="partijcol-center">${kruisRText}</span></div>`;
            })
            .join("");

          const partijItems = partijenListEl.querySelectorAll(".partijitem");
          const visibleCount = Math.min(partijItems.length, 4);
          if (visibleCount > 0) {
            let visibleHeight = 0;
            for (let index = 0; index < visibleCount; index += 1) {
              visibleHeight += partijItems[index].offsetHeight;
            }
            partijenListEl.style.maxHeight = `${visibleHeight}px`;
          }

          partijenListEl.scrollTop = partijenListEl.scrollHeight;
        }

        async function sendCurrentTotal(forceMessage = false, isFinal = false) {
          if (partijen.length === 0) {
            return false;
          }

          if (sendInFlight) {
            sendAgain = true;
            return false;
          }

          sendInFlight = true;
          const {
            baseTotals,
            kruisTotals,
            currentTotals,
            winnerTeam,
            loserBonusKruis,
            finalKruisTotals,
            finalTotals,
          } = getMatchTotals(isFinal);
          const roemTotals = getRoemTotals();
          const scoreTotals = isFinal ? finalTotals : currentTotals;
          const appliedKruisTotals = isFinal ? finalKruisTotals : kruisTotals;
          const bonusPoints = {
            left: appliedKruisTotals.right * 100,
            right: appliedKruisTotals.left * 100,
          };

          if (forceMessage) {
            setMessage("Versturen...", "");
          }

          try {
            const payload = {
              tournamentId,
              tournamentDate: date,
              mode,
              matchType,
              group,
              round,
              table,
              matchIndex,
              finalIndex,
              teamL,
              teamR,
              // scoreL/scoreR zijn de eindscore inclusief kruis-afrekening.
              scoreL: scoreTotals.left,
              scoreR: scoreTotals.right,
              baseScoreL: baseTotals.left,
              baseScoreR: baseTotals.right,
              roemL: roemTotals.left,
              roemR: roemTotals.right,
              kruisL: appliedKruisTotals.left,
              kruisR: appliedKruisTotals.right,
              loserBonusKruisL: loserBonusKruis.left,
              loserBonusKruisR: loserBonusKruis.right,
              bonusPointsL: bonusPoints.left,
              bonusPointsR: bonusPoints.right,
              winnerTeam,
              lastTroefTeam: getLastTroefTeam(),
              partyCount: partijen.length,
              parties: partijen,
              isFinal,
              submittedAt: new Date().toISOString(),
            };

            const endpoints = [
              `${apiBaseUrl()}/score-forms/submit`,
              `${apiBaseUrl()}/score-entries/log`,
            ];

            let lastError = "Onbekende fout";
            let delivered = false;

            for (const endpoint of endpoints) {
              try {
                const response = await fetch(endpoint, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify(payload),
                });

                if (response.ok) {
                  delivered = true;
                  break;
                }

                const responseText = await response.text();
                lastError = `API fout (${response.status}) ${
                  responseText || ""
                }`.trim();
              } catch (endpointError) {
                lastError = endpointError?.message || "Netwerkfout";
              }
            }

            if (!delivered) {
              throw new Error(lastError);
            }

            lastSubmittedWasFinal = isFinal;

            if (forceMessage) {
              setMessage(
                `Stand verstuurd: ${scoreTotals.left} - ${scoreTotals.right}`,
                "ok",
              );
            }

            return true;
          } catch (error) {
            setMessage(`Versturen mislukt: ${error.message}`, "err");
            return false;
          } finally {
            sendInFlight = false;
            if (sendAgain) {
              sendAgain = false;
              queueMicrotask(() => {
                sendCurrentTotal(false).catch(() => {});
              });
            }
          }
        }

        function addPartij() {
          const pointsL = Number(pointsLInput.value);
          const pointsR = Number(pointsRInput.value);
          const inputKruisL = kruisCounts.L;
          const inputKruisR = kruisCounts.R;
          const currentTroefTeam = troefState.ownerTeam;
          const currentTroefSuit = currentTroefTeam
            ? troefState.selectedSuit[currentTroefTeam]
            : null;
          const roem20L = getRoemCount("L", 20);
          const roem50L = getRoemCount("L", 50);
          const roem100L = getRoemCount("L", 100);
          const roem200L = getRoemCount("L", 200);
          const roem20R = getRoemCount("R", 20);
          const roem50R = getRoemCount("R", 50);
          const roem100R = getRoemCount("R", 100);
          const roem200R = getRoemCount("R", 200);

          if (roem200L + roem200R > 1) {
            setMessage(
              "200 roem mag per partij maximaal 1x voorkomen bij een van beide teams.",
              "err",
            );
            return;
          }

          const roemL =
            roem20L * 20 + roem50L * 50 + roem100L * 100 + roem200L * 200;
          const roemR =
            roem20R * 20 + roem50R * 50 + roem100R * 100 + roem200R * 200;
          const currentScoreFlag = scoreFlagState;
          const computedScores = computePartijScores({
            pointsL,
            pointsR,
            roemL,
            roemR,
            troefTeam: currentTroefTeam,
            troefSuit: currentTroefSuit,
            scoreFlag: currentScoreFlag,
          });
          const scoreL = computedScores.scoreL;
          const scoreR = computedScores.scoreR;
          const kruisL = inputKruisL + computedScores.extraKruisL;
          const kruisR = inputKruisR + computedScores.extraKruisR;

          if (
            !Number.isFinite(pointsL) ||
            !Number.isFinite(pointsR) ||
            pointsL < 0 ||
            pointsR < 0
          ) {
            setMessage("Vul geldige punten in.", "err");
            return;
          }

          if (pointsL + pointsR !== TOTAL_POINTS_PER_PARTIJ) {
            setMessage(
              `Getelde punten moeten samen precies ${TOTAL_POINTS_PER_PARTIJ} zijn.`,
              "err",
            );
            return;
          }

          if (!currentTroefTeam || !currentTroefSuit) {
            setMessage("Kies eerst een troefkleur.", "err");
            return;
          }

          const validKruisL =
            Number.isInteger(kruisL) && kruisL >= 0 && kruisL <= 32;
          const validKruisR =
            Number.isInteger(kruisR) && kruisR >= 0 && kruisR <= 32;
          if (!validKruisL || !validKruisR) {
            setMessage("Aantal kruisen moet tussen 0 en 32 zijn.", "err");
            return;
          }

          const partijPayload = {
            pointsL,
            pointsR,
            troefTeam: currentTroefTeam,
            troefSuit: currentTroefSuit,
            scoreFlag: currentScoreFlag,
            scoreMultiplier: computedScores.scoreMultiplier,
            scoreL,
            scoreR,
            roemL,
            roemR,
            roem20L,
            roem50L,
            roem100L,
            roem200L,
            roem20R,
            roem50R,
            roem100R,
            roem200R,
            autoKruisL: computedScores.extraKruisL,
            autoKruisR: computedScores.extraKruisR,
            kruisL,
            kruisR,
            inputKruisL,
            inputKruisR,
          };

          const isEditingExistingPartij =
            Number.isInteger(editingPartijIndex) &&
            editingPartijIndex >= 0 &&
            editingPartijIndex < partijen.length;

          if (isEditingExistingPartij) {
            partijen[editingPartijIndex] = partijPayload;
          } else {
            partijen.push(partijPayload);
          }
          pointsLInput.value = "0";
          pointsRInput.value = "0";
          scoreLInput.value = "0";
          scoreRInput.value = "0";
          setRoemCount("L", 20, 0);
          setRoemCount("L", 50, 0);
          setRoemCount("L", 100, 0);
          setRoemCount("L", 200, 0);
          setRoemCount("R", 20, 0);
          setRoemCount("R", 50, 0);
          setRoemCount("R", 100, 0);
          setRoemCount("R", 200, 0);
          setKruisCount("L", 0);
          setKruisCount("R", 0);
          scoreFlagState = null;
          document
            .querySelectorAll("#scoreFlagK, #scoreFlagR, #scoreFlagS")
            .forEach((cb) => {
              cb.checked = false;
            });
          focusElement(pointsLInput);

          const nextTroefTeam = currentTroefTeam === "L" ? "R" : "L";
          troefState.activeTeam = nextTroefTeam;
          troefState.ownerTeam = null;
          troefState.selectedSuit[nextTroefTeam] = null;
          updateTroefAndScorePanels();

          clearCurrentPartijTotal();
          const updatedIndex = editingPartijIndex;
          editingPartijIndex = null;
          updatePartijLabels();
          hasCalculatedTotal = true;
          updateActionButtons();
          setMessage(
            Number.isInteger(updatedIndex) && updatedIndex >= 0
              ? `Partij ${updatedIndex + 1} bijgewerkt.`
              : "Partij toegevoegd.",
            "ok",
          );
          renderPartijen();
          if (mode !== "final") {
            sendCurrentTotal(true);
          }

          saveScoreEntryState();
        }

        function restorePartijInputs(partij) {
          pointsLInput.value = String(Number(partij?.pointsL ?? 0));
          pointsRInput.value = String(Number(partij?.pointsR ?? 0));

          setRoemCount("L", 20, Number(partij?.roem20L ?? 0));
          setRoemCount("L", 50, Number(partij?.roem50L ?? 0));
          setRoemCount("L", 100, Number(partij?.roem100L ?? 0));
          setRoemCount("L", 200, Number(partij?.roem200L ?? 0));
          setRoemCount("R", 20, Number(partij?.roem20R ?? 0));
          setRoemCount("R", 50, Number(partij?.roem50R ?? 0));
          setRoemCount("R", 100, Number(partij?.roem100R ?? 0));
          setRoemCount("R", 200, Number(partij?.roem200R ?? 0));

          setKruisCount("L", Number(partij?.inputKruisL ?? 0));
          setKruisCount("R", Number(partij?.inputKruisR ?? 0));

          scoreFlagState = partij?.scoreFlag || null;
          document
            .querySelectorAll("#scoreFlagK, #scoreFlagR, #scoreFlagS")
            .forEach((cb) => {
              cb.checked = false;
            });
          if (scoreFlagState === "kraak") {
            document.getElementById("scoreFlagK").checked = true;
          } else if (scoreFlagState === "re") {
            document.getElementById("scoreFlagR").checked = true;
          } else if (scoreFlagState === "super") {
            document.getElementById("scoreFlagS").checked = true;
          }

          troefState.activeTeam = partij?.troefTeam || null;
          troefState.ownerTeam = partij?.troefTeam || null;
          troefState.selectedSuit.L = null;
          troefState.selectedSuit.R = null;
          if (partij?.troefTeam && partij?.troefSuit) {
            troefState.selectedSuit[partij.troefTeam] = partij.troefSuit;
          }

          updateTroefAndScorePanels();
          updateRoemTotalDisplay();
          clearCurrentPartijTotal();
          focusElement(pointsLInput);
        }

        function undoPartij() {
          if (partijen.length === 0) {
            setMessage("Er is geen partij om ongedaan te maken.", "err");
            return;
          }

          const revertFinalSubmission = lastSubmittedWasFinal;
          lastSubmittedWasFinal = false;
          editingPartijIndex = null;

          const removedPartij = partijen.pop();
          restorePartijInputs(removedPartij);

          if (partijen.length === 0) {
            // eerste partij opnieuw invoeren: troef voor team uit undone partij blijft geselecteerd
          } else {
            const lastTroefTeam = partijen[partijen.length - 1].troefTeam;
            const nextTroefTeam = lastTroefTeam === "L" ? "R" : "L";
            if (!removedPartij?.troefTeam) {
              troefState.activeTeam = nextTroefTeam;
              troefState.ownerTeam = null;
              troefState.selectedSuit[nextTroefTeam] = null;
            }
          }

          updateTroefAndScorePanels();
          updatePartijLabels();
          updateActionButtons();
          setMessage(
            "Laatste partij ongedaan gemaakt. Klik op Bereken om kruisen opnieuw te berekenen.",
            "ok",
          );
          renderPartijen();
          if (mode !== "final" || revertFinalSubmission) {
            sendCurrentTotal(true, false);
          }

          if (revertFinalSubmission) {
            setFinalSubmittedState(false);
            setMessage(
              "Eindstand ongedaan gemaakt. Tussenstand opnieuw berekend.",
              "ok",
            );
          }

          saveScoreEntryState();
        }

        calcTotaalBtn.addEventListener("click", () =>
          calculateCurrentPartijTotal(true),
        );
        addPartijBtn.addEventListener("click", addPartij);
        undoPartijBtn.addEventListener("click", undoPartij);
        partijenListEl.addEventListener("click", (event) => {
          const item = event.target.closest(".partijitem");
          if (!item || !partijenListEl.contains(item)) {
            return;
          }

          const selectedIndex = Number(item.getAttribute("data-partij-index"));
          if (
            !Number.isInteger(selectedIndex) ||
            selectedIndex < 0 ||
            selectedIndex >= partijen.length
          ) {
            return;
          }

          editingPartijIndex = selectedIndex;
          restorePartijInputs(partijen[selectedIndex]);
          updatePartijLabels();
          updateActionButtons();
          renderPartijen();
          setMessage(
            `Partij ${selectedIndex + 1} geladen. Klik op Bereken en daarna Verwerk om op te slaan.`,
            "ok",
          );
        });

        // === Lock mekanisme starten ===
        const hasLock = acquireTabelLock();
        checkAndUpdateViewOnlyMode();
        if (hasLock) {
          // Vernieuwen we de lock elke 30 seconden
          lockRenewalInterval = setInterval(() => {
            renewTabelLock();
          }, 30000);
        } else {
          // Controleer elke 2 seconden of de lock vrijgegeven is
          lockCheckInterval = setInterval(() => {
            const hasLockNow = acquireTabelLock();
            checkAndUpdateViewOnlyMode();
            if (hasLockNow) {
              clearInterval(lockCheckInterval);
              lockCheckInterval = null;
              lockRenewalInterval = setInterval(() => {
                renewTabelLock();
              }, 30000);
              setMessage("U hebt de bewerkingsrechten overgenomen.", "ok");
            }
          }, 2000);
        }
        // Bij verlaten van pagina, lock vrijgeven
        window.addEventListener("unload", () => {
          releaseTabelLock();
          if (lockRenewalInterval) clearInterval(lockRenewalInterval);
          if (lockCheckInterval) clearInterval(lockCheckInterval);
          if (viewOnlyPollingInterval) clearInterval(viewOnlyPollingInterval);
        });
        // === Lock mekanisme klaar ===

        updatePartijLabels();
        setKruisCount("L", 0);
        setKruisCount("R", 0);
        pointsLInput.value = "0";
        pointsRInput.value = "0";
        applyScoreEntryStateFromStorage();
        updatePartijLabels();
        updateTroefAndScorePanels();
        updateRoemTotalDisplay();
        setupFirefoxCursorGuard();
        clearCurrentPartijTotal();
        renderPartijen();
        updateActionButtons();
        applyFinalSubmittedStateFromStorage();
        restoreExistingSubmission();
        if (metaQrBtn) {
          metaQrBtn.addEventListener("click", openMetaQrLink);
        }
        if (qrCloseBtnEl) {
          qrCloseBtnEl.addEventListener("click", closeMetaQrOverlay);
        }
        if (qrOverlayEl) {
          qrOverlayEl.addEventListener("click", (event) => {
            if (event.target === qrOverlayEl) {
              closeMetaQrOverlay();
            }
          });
        }
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && qrOverlayEl?.classList.contains("is-open")) {
            closeMetaQrOverlay();
          }
        });
        viewStandBtn.addEventListener("click", () => {
          window.location.href = buildStandingsUrl();
        });

        document
          .getElementById("scoreForm")
          .addEventListener("submit", async (event) => {
            event.preventDefault();

            if (partijen.length === 0) {
              setMessage(
                "Voeg minimaal 1 partij toe voordat je verstuurt.",
                "err",
              );
              return;
            }

            submitBtn.disabled = true;
            renderPartijen();
            setMessage("Eindtotaal maken en versturen...", "");
            try {
              const sent = await sendCurrentTotal(true, true);
              if (sent) {
                setFinalSubmittedState(true);
                submitBtn.classList.add("hidden");
                viewStandBtn.classList.remove("hidden");
                // Probeer het formuliervenster automatisch te sluiten.
                if (!isFirefoxBrowser()) {
                  window.close();
                }
                if (!window.closed) {
                  setMessage(
                    "Eindtotaal verstuurd. Tik op 'Bekijk tussenstand'.",
                    "ok",
                  );
                  focusElement(viewStandBtn);
                }
              }
            } finally {
              updateActionButtons();
            }
          });
      })();
    </script>
  </body>
</html>
